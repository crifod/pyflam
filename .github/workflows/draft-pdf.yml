name: Draft PDF (JOSS)

# Build the JOSS paper to a typeset PDF so it can be previewed before submission.
# Runs when the paper changes (or on demand); uploads paper.pdf as a build artifact.
on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

jobs:
  paper:
    name: Build draft PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # master @ 2024-07-17
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload paper PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: paper
          path: paper/paper.pdf
          if-no-files-found: error
